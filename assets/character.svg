<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#1E1B4B"/>
      <circle cx="2" cy="2" r="1.15" fill="#3730A3"/>
    </pattern>
    <linearGradient id="hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3F2A1D"/>
      <stop offset="100%" stop-color="#1C100A"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3C7A5"/>
      <stop offset="100%" stop-color="#E8B28C"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>

  <rect width="420" height="420" rx="28" fill="url(#dots)"/>

  <circle cx="52" cy="64" r="8" fill="#F9A8D4"/>
  <circle cx="368" cy="86" r="7" fill="#67E8F9"/>
  <circle cx="78" cy="338" r="6" fill="#FDE68A"/>
  <circle cx="390" cy="250" r="5" fill="#C4B5FD"/>
  <rect x="338" y="318" width="13" height="13" rx="2" fill="#A78BFA" transform="rotate(18 344 324)"/>
  <polygon points="64,236 78,260 48,260" fill="#86EFAC"/>
  <path d="M292 42 l4 11 12 1 -9 7 3 11 -10-6 -10 6 3-11 -9-7 12-1 z" fill="#F9A8D4"/>
  <path d="M354 188 l3 8 9 1 -7 5 2 8 -7-5 -7 5 2-8 -7-5 9-1 z" fill="#FDE68A"/>
  <path d="M40 168 l3 7 8 1 -6 5 2 7 -7-4 -7 4 2-7 -6-5 8-1 z" fill="#67E8F9"/>

  <ellipse cx="210" cy="372" rx="86" ry="16" fill="#0F172A" opacity="0.35"/>

  <!-- hair back -->
  <ellipse cx="210" cy="168" rx="92" ry="108" fill="url(#hair)"/>
  <path d="M118 180 c-8 70 8 130 28 150" fill="none" stroke="#1C100A" stroke-width="28" stroke-linecap="round"/>
  <path d="M302 180 c8 70 -8 130 -28 150" fill="none" stroke="#1C100A" stroke-width="28" stroke-linecap="round"/>

  <!-- hoodie body -->
  <path d="M128 248 c10 86 154 86 164 0 v-18 c-16 42-148 42-164 0 z" fill="url(#hoodie)"/>
  <path d="M148 238 c20 54 104 54 124 0" fill="none" stroke="#5B21B6" stroke-width="12" stroke-linecap="round"/>
  <circle cx="210" cy="278" r="8" fill="#E9D5FF"/>
  <circle cx="210" cy="278" r="4" fill="#C4B5FD"/>

  <!-- neck -->
  <rect x="192" y="214" width="36" height="28" rx="12" fill="url(#skin)"/>

  <!-- face -->
  <ellipse cx="210" cy="168" rx="68" ry="74" fill="url(#skin)"/>

  <!-- bangs -->
  <path d="M142 148 c18-62 118-62 136 0 c-22-28-48-40-68-40 s-46 12-68 40 z" fill="url(#hair)"/>
  <path d="M150 132 c20 28 18 48 8 62" fill="none" stroke="#1C100A" stroke-width="10" stroke-linecap="round"/>
  <path d="M270 132 c-20 28-18 48-8 62" fill="none" stroke="#1C100A" stroke-width="10" stroke-linecap="round"/>
  <path d="M210 108 c-6 36 0 58 0 70" fill="none" stroke="#2A1810" stroke-width="8" stroke-linecap="round" opacity="0.7"/>

  <!-- round glasses -->
  <circle cx="178" cy="168" r="24" fill="#FFFFFF" fill-opacity="0.18" stroke="#1E1B4B" stroke-width="5"/>
  <circle cx="242" cy="168" r="24" fill="#FFFFFF" fill-opacity="0.18" stroke="#1E1B4B" stroke-width="5"/>
  <path d="M202 168 h16" stroke="#1E1B4B" stroke-width="5" stroke-linecap="round"/>
  <path d="M154 164 h-16" stroke="#1E1B4B" stroke-width="4" stroke-linecap="round"/>
  <path d="M266 164 h16" stroke="#1E1B4B" stroke-width="4" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="178" cy="170" rx="8" ry="10" fill="#1E1B4B"/>
  <ellipse cx="242" cy="170" rx="8" ry="10" fill="#1E1B4B"/>
  <circle cx="181" cy="167" r="2.5" fill="#FFFFFF"/>
  <circle cx="245" cy="167" r="2.5" fill="#FFFFFF"/>

  <!-- brows -->
  <path d="M160 146 q18 -8 34 0" fill="none" stroke="#2A1810" stroke-width="4" stroke-linecap="round"/>
  <path d="M226 146 q18 -8 34 0" fill="none" stroke="#2A1810" stroke-width="4" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="156" cy="190" rx="12" ry="7" fill="#F9A8D4" opacity="0.7"/>
  <ellipse cx="264" cy="190" rx="12" ry="7" fill="#F9A8D4" opacity="0.7"/>

  <!-- smile -->
  <path d="M192 198 q18 16 36 0" fill="none" stroke="#C2410C" stroke-width="4" stroke-linecap="round"/>

  <!-- arms to laptop -->
  <path d="M132 262 c-18 28 -8 48 18 52" fill="none" stroke="url(#hoodie)" stroke-width="28" stroke-linecap="round"/>
  <path d="M288 262 c18 28 8 48 -18 52" fill="none" stroke="url(#hoodie)" stroke-width="28" stroke-linecap="round"/>
  <circle cx="154" cy="318" r="14" fill="url(#skin)"/>
  <circle cx="266" cy="318" r="14" fill="url(#skin)"/>

  <!-- laptop -->
  <g transform="translate(118, 300)">
    <rect x="8" y="18" width="168" height="92" rx="10" fill="#0F172A"/>
    <rect x="18" y="28" width="148" height="72" rx="6" fill="#312E81"/>
    <rect x="26" y="36" width="70" height="8" rx="3" fill="#67E8F9" opacity="0.9"/>
    <rect x="26" y="52" width="108" height="6" rx="3" fill="#A78BFA" opacity="0.8"/>
    <rect x="26" y="66" width="92" height="6" rx="3" fill="#F9A8D4" opacity="0.75"/>
    <rect x="26" y="80" width="54" height="6" rx="3" fill="#86EFAC" opacity="0.8"/>
    <text x="150" y="86" text-anchor="end" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">&lt;/&gt;</text>
    <rect x="0" y="108" width="184" height="12" rx="4" fill="#334155"/>
  </g>
</svg>
