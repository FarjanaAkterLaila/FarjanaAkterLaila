<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Farjana Akter Laila  Mid-level Developer at XIIA</title>
  <desc id="desc">Animated GitHub profile banner</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B18">
        <animate attributeName="stop-color" values="#070B18;#0B1224;#070B18" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#101A36"/>
      <stop offset="100%" stop-color="#0A1628">
        <animate attributeName="stop-color" values="#0A1628;#132038;#0A1628" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-0.4 0" to="0.4 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1280" height="420" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#bg)"/>

    <circle cx="180" cy="80" r="220" fill="url(#orb1)">
      <animate attributeName="cx" values="180;240;180" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;140;80" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="300" r="260" fill="url(#orb2)">
      <animate attributeName="cx" values="1080;1000;1080" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;220;300" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="-20" r="180" fill="url(#orb3)">
      <animate attributeName="cy" values="-20;40;-20" dur="8s" repeatCount="indefinite"/>
    </circle>

    <g opacity="0.18" stroke="#94A3B8" stroke-width="1">
      <path d="M0 70 H1280 M0 140 H1280 M0 210 H1280 M0 280 H1280 M0 350 H1280"/>
      <path d="M160 0 V420 M320 0 V420 M480 0 V420 M640 0 V420 M800 0 V420 M960 0 V420 M1120 0 V420"/>
    </g>

    <rect x="36" y="36" width="1208" height="348" rx="22" fill="none" stroke="#67E8F9" stroke-opacity="0.22" stroke-width="1.5"/>

    <text x="80" y="118" fill="#67E8F9" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" letter-spacing="4">
      HELLO, I'M
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </text>

    <text x="80" y="188" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="56" font-weight="700">
      Farjana Akter Laila
    </text>

    <rect x="80" y="208" width="420" height="4" rx="2" fill="url(#accent)">
      <animate attributeName="width" values="80;420;80" dur="5s" repeatCount="indefinite"/>
    </rect>

    <text x="80" y="262" fill="#CBD5E1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26">
      Mid-level Developer  ·  XIIA
    </text>
    <text x="80" y="302" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18">
      Frontend  ·  React  ·  JavaScript  ·  MERN  ·  Denmark
    </text>

    <g transform="translate(80, 338)">
      <rect width="168" height="32" rx="16" fill="#0EA5E9" fill-opacity="0.18" stroke="#67E8F9" stroke-width="1"/>
      <text x="84" y="21" text-anchor="middle" fill="#E0F2FE" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">Open to collab</text>
      <rect x="184" width="148" height="32" rx="16" fill="#A78BFA" fill-opacity="0.16" stroke="#C4B5FD" stroke-width="1"/>
      <text x="258" y="21" text-anchor="middle" fill="#EDE9FE" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">Building at XIIA</text>
    </g>

    <g transform="translate(980, 90)">
      <circle cx="90" cy="110" r="86" fill="none" stroke="#1E293B" stroke-width="10"/>
      <circle cx="90" cy="110" r="86" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="420" stroke-dashoffset="80">
        <animate attributeName="stroke-dashoffset" values="420;80;420" dur="7s" repeatCount="indefinite"/>
      </circle>
      <text x="90" y="104" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="700">CODE</text>
      <text x="90" y="132" text-anchor="middle" fill="#67E8F9" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14">CREATE</text>
    </g>
  </g>
</svg>
