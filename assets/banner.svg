<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220">
  <defs>
    <linearGradient id="nbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="220" fill="url(#nbg)"/>

  <g stroke="#22D3EE" stroke-opacity="0.14" stroke-width="1">
    <path d="M0 55 H1280 M0 110 H1280 M0 165 H1280"/>
    <path d="M160 0 V220 M320 0 V220 M480 0 V220 M640 0 V220 M800 0 V220 M960 0 V220 M1120 0 V220"/>
  </g>

  <circle cx="180" cy="50" r="80" fill="#22D3EE" fill-opacity="0.16">
    <animate attributeName="r" values="70;100;70" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="170" r="90" fill="#22D3EE" fill-opacity="0.1">
    <animate attributeName="cy" values="170;130;170" dur="8s" repeatCount="indefinite"/>
  </circle>

  <text x="640" y="118" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800">FARJANA AKTER LAILA</text>
  <rect x="490" y="146" width="300" height="3" rx="2" fill="#22D3EE">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/>
  </rect>
</svg>
