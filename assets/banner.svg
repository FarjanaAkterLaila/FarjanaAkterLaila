      <path d="M54 32 c0-4 3-7 7-7 s6 3 6 7 v16" fill="#FDE68A" stroke="#FBBF24" stroke-width="2"/>
      <path d="M18 42 c-6 2-10 8-8 14 4 12 18 18 28 14 8-3 14-10 16-18" fill="#FDE68A" stroke="#FBBF24" stroke-width="2"/>
