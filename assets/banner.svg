<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280" role="img">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="45%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="280" rx="8" fill="url(#sky)"/>

  <!-- floating shapes: different layout from the reference -->
  <g fill="none" stroke="#F9A8D4" stroke-width="5" opacity="0.9">
    <circle cx="70" cy="210" r="28">
      <animate attributeName="cy" values="210;195;210" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1210" cy="55" r="16" stroke="#FDE68A" stroke-width="4">
      <animate attributeName="cy" values="55;70;55" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="160" cy="48" r="14" fill="#86EFAC" opacity="0.95">
    <animate attributeName="cy" values="48;62;48" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="240" cy="230" r="10" fill="#F9A8D4">
    <animate attributeName="r" values="10;14;10" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="210" r="12" fill="#A5F3FC">
    <animate attributeName="cy" values="210;198;210" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="46" r="8" fill="#FBCFE8"/>
  <rect x="118" y="118" width="18" height="18" rx="3" fill="none" stroke="#FDE68A" stroke-width="3" transform="rotate(18 127 127)">
    <animateTransform attributeName="transform" type="rotate" values="18 127 127;38 127 127;18 127 127" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="1128" y="168" width="22" height="22" rx="4" fill="none" stroke="#C4B5FD" stroke-width="3">
    <animateTransform attributeName="transform" type="rotate" values="0 1139 179;20 1139 179;0 1139 179" dur="5s" repeatCount="indefinite"/>
  </rect>

  <polygon points="330,42 342,68 316,68" fill="#FDBA74">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="3.5s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="1048,118 1062,146 1032,146" fill="#67E8F9" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="4.1s" repeatCount="indefinite"/>
  </polygon>

  <g fill="#FDE68A">
    <path d="M48 88 l4 10 11 1 -8 7 3 10 -10 -6 -10 6 3-10 -8-7 11-1 z"/>
    <path d="M1238 128 l3 8 9 1 -7 5 2 8 -7-5 -7 5 2-8 -7-5 9-1 z"/>
  </g>
  <g fill="#F9A8D4">
    <path d="M1188 88 l3 7 8 1 -6 5 2 7 -7-4 -7 4 2-7 -6-5 8-1 z"/>
    <path d="M88 38 l2 6 7 1 -5 4 2 6 -6-4 -6 4 2-6 -5-4 7-1 z"/>
  </g>

  <text x="640" y="92" text-anchor="middle" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="10" font-weight="600">
    HI, I'M
  </text>
  <text x="640" y="168" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="4" filter="url(#glow)">
    FARJANA AKTER
  </text>
  <text x="640" y="208" text-anchor="middle" fill="#F5D0FE" font-family="Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="12" font-weight="600">
    LAILA
  </text>
</svg>
